[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kidneysim"
version = "0.1.0"
description = "An incremental, educational model of the human kidney (physics + chemistry) for high-school students"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "matplotlib>=3.5"]

[project.optional-dependencies]
interactive = ["plotly>=5.0", "ipywidgets>=7.0"]

[tool.setuptools]
packages = ["kidneysim"]
